name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Restore TLS keystore from secret
        if: ${{ env.APP_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p build/ci-keystore
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > build/ci-keystore/rbpo-service.p12

      - name: Compile
        run: ./mvnw -B compile

      - name: Test
        run: ./mvnw -B test

      - name: Build package
        run: ./mvnw -B package -DskipTests
        env:
          SERVER_SSL_ENABLED: "false"
          SERVER_SSL_KEY_STORE: build/ci-keystore/rbpo-service.p12
          SERVER_SSL_KEY_STORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          SERVER_SSL_KEY_ALIAS: rbpo-service-1bib23219

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-api-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
