spring.application.name=demo
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
jwt.secret=${JWT_SECRET:change-this-secret-for-local-development}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
jwt.issuer=${JWT_ISSUER:demo-api}
license.ticket-ttl-seconds=${LICENSE_TICKET_TTL_SECONDS:300}
signature.key-store-path=${SIGNATURE_KEY_STORE_PATH:}
signature.key-store-password=${SIGNATURE_KEY_STORE_PASSWORD:}
signature.key-store-type=${SIGNATURE_KEY_STORE_TYPE:PKCS12}
signature.key-alias=${SIGNATURE_KEY_ALIAS:ticket-signing}
signature.key-password=${SIGNATURE_KEY_PASSWORD:${SIGNATURE_KEY_STORE_PASSWORD:}}
signature.algorithm=${SIGNATURE_ALGORITHM:SHA256withRSA}
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:rbpo-service-1bib23219}
